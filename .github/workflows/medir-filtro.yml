name: Medir Filtro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Medir
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: |
          set -o pipefail
          python -u medir_faves.py 2>&1 | tee log_medicao.txt
      - name: Salvar log
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add -f log_medicao.txt
          git diff --staged --quiet || git commit -m "medicao do filtro"
          git push

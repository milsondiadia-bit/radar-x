name: Radar X

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Rodar o radar
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python -u radar.py 2>&1 | tee log.txt

      - name: Salvar estado e log
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add estado.json
          git add -f log.txt
          git diff --staged --quiet && exit 0
          git commit -m "estado $(date -u '+%Y-%m-%d %H:%M')"
          # Outro workflow pode ter gravado neste repositorio no mesmo minuto.
          # Sincroniza e tenta de novo antes de desistir.
          for tentativa in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push recusado (tentativa $tentativa) - sincronizando"
            git pull --rebase --autostash origin main || true
            sleep $((tentativa * 5))
          done
          echo "nao consegui salvar o log, mas o bot rodou normalmente"
          exit 0

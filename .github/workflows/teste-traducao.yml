name: Teste Traducao

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Testar traducao
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python -u testar_trad.py 2>&1 | tee log_traducao.txt
      - name: Salvar log
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add -f log_traducao.txt
          git diff --staged --quiet || git commit -m "teste traducao"
          git push
